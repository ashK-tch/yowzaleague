name: Update site

on:
  schedule:
    # Every morning at 6:17 a.m. Eastern (7:17 during daylight time). GitHub schedules run in UTC.
    - cron: "17 11 * * *"
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the math
        run: |
          python test_lineup.py
          python test_season.py

      - name: Build the site from ESPN
        env:
          LEAGUE_ID: ${{ vars.LEAGUE_ID }}
          SEASON: ${{ vars.SEASON }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SITE_PASSWORDS: ${{ secrets.SITE_PASSWORDS }}
          SITE_QUESTION: ${{ vars.SITE_QUESTION }}
        run: |
          if [ -n "$LEAGUE_ID" ]; then
            python build.py
          else
            echo "LEAGUE_ID isn't set yet, so building with sample data."
            python build.py --sample
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
